name: docs-to-pdf
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs exist
        run: |
          for f in BRD PRD FSD SRS; do test -s "docs/$f.md" || { echo "missing docs/$f.md"; exit 1; }; done
      - name: Check requirement IDs unique
        run: |
          check() { # $1=file $2=pattern — duplikat hanya dihitung di dokumen definisi (referensi silang sah)
            dup=$(grep -oE "$2" "$1" | sort | uniq -d || true)
            if [ -n "$dup" ]; then echo "duplicate IDs in $1 ($2): $dup"; exit 1; fi
          }
          check docs/BRD.md "BR-[0-9][0-9]"
          check docs/PRD.md "US-[0-9][0-9]"
          check docs/FSD.md "FS-[0-9][0-9]"
          # SRS: hanya bagian definisi (§1-3); matrix §6 memang mereferensikan ulang
          dup=$(sed '/^## 4\. Glosarium/,$d' docs/SRS.md | grep -oE "FR-[A-Z]+-[0-9][0-9]" | sort | uniq -d || true)
          if [ -n "$dup" ]; then echo "duplicate IDs in docs/SRS.md: $dup"; exit 1; fi
          echo "IDs unique"
      - name: Check cross-links
        run: |
          grep -q "docs/BRD.md" README.md && grep -q "docs/PRD.md" README.md \
            && grep -q "docs/FSD.md" README.md && grep -q "docs/SRS.md" README.md \
            || { echo "README index incomplete"; exit 1; }
          echo "links OK"
  pdf:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDFs
        run: |
          mkdir -p pdf
          for f in BRD PRD FSD SRS; do
            docker run --rm -v "$PWD:/data" -w /data pandoc/latex:3.1 \
              "docs/$f.md" -o "pdf/$f.pdf" --pdf-engine=pdflatex \
              -V geometry:margin=2.5cm --toc \
              --metadata title="$f - Shiftbase"
          done
          ls -la pdf/
      - name: Check PDFs readable
        run: |
          for f in BRD PRD FSD SRS; do
            test -s "pdf/$f.pdf" || { echo "empty pdf/$f.pdf"; exit 1; }
          done
          echo "PDFs OK"
      - name: Release PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" pdf/*.pdf \
            --title "${{ github.ref_name }} - Dokumen Shiftbase" \
            --notes "BRD, PRD, FSD, SRS (PDF). Sumber Markdown tersedia di tag ini."
